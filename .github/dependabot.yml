version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: chore, include: scope }
    # Major versions need a migration (e.g. `ng update`) and get their own hand-made PR,
    # so Dependabot only proposes minor and patch updates.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@angular-eslint/*']
      lint-format:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier']
      test:
        patterns: ['vitest', '@vitest/*', 'jsdom']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
