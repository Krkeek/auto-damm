name: CMS auto-merge

# A change saved on the admin page (/admin) arrives as a PR from a cms/ branch. This turns on GitHub's auto-merge for
# it, so it is squash-merged as soon as the required checks are green and the owner does not have to publish it by hand.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-merge:
    name: auto-merge
    # Only branches of this repository count: a fork cannot get merged by naming its branch cms/.
    if: startsWith(github.head_ref, 'cms/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.html_url }}
      SETTINGS: src/app/core/content/owner-settings.json
    steps:
      - name: Auto-merge if only the owner settings changed
        run: |
          files=$(gh pr view "$PR" --json files --jq '[.files[].path] | join(" ")')
          if [ "$files" = "$SETTINGS" ]; then
            gh pr merge "$PR" --auto --squash
          else
            echo "::warning::Not auto-merging, the PR changes more than $SETTINGS: $files"
            gh pr merge "$PR" --disable-auto || true
          fi
