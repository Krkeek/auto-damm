<header [class.sc]="scroll.scrolled()">
  <div class="wrap">
    <a class="brand" href="#home" (click)="go($event, 'home')"><b>AUTO</b>DAMM</a>

    <nav [attr.aria-label]="content.nav.label">
      @for (item of items; track item.id) {
        <a
          [href]="'#' + item.id"
          [attr.aria-current]="scroll.activeSection() === item.id ? 'true' : null"
          (click)="go($event, item.id)"
          >{{ item.label }}</a
        >
      }
    </nav>

    <div class="ctl">
      <button
        type="button"
        class="theme"
        [attr.aria-label]="themeLabel()"
        [title]="themeLabel()"
        (click)="theme.toggle()"
      >
        @if (theme.isDark()) {
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4.5" />
            <path
              d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"
            />
          </svg>
        } @else {
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11Z" />
          </svg>
        }
      </button>
    </div>
  </div>
  <i class="bar" [style.transform]="'scaleX(' + scroll.progress() + ')'"></i>
</header>
