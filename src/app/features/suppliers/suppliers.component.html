<section [id]="section.suppliers">
  <div class="wrap doc sec">
    <h2 class="st rv" appReveal>{{ content.suppliers.title }}</h2>

    @for (paragraph of content.suppliers.paragraphs; track paragraph) {
      <p data-reveal appReveal>{{ paragraph }}</p>
    }
    <p data-reveal appReveal>
      <strong>{{ content.suppliers.highlight }}</strong>
    </p>

    <blockquote class="q" data-reveal appReveal>{{ content.suppliers.quote }}</blockquote>

    <div class="marquee wide">
      <div class="marquee-track">
        @for (copy of [0, 1]; track copy) {
          <ul class="logos" [attr.aria-hidden]="copy ? 'true' : null">
            @for (supplier of profile.suppliers; track supplier.name) {
              <li>
                <img
                  [src]="supplier.logo"
                  [alt]="copy ? '' : supplier.name"
                  [attr.width]="supplier.width"
                  [attr.height]="supplier.height"
                />
              </li>
            }
          </ul>
        }
      </div>
    </div>
  </div>
</section>
