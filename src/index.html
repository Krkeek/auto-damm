<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Auto-Damm – Autoteile und Altautoverwertung in Frankenberg</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Autoteile, Zubehör und zertifizierte Altautoverwertung in Frankenberg/Sa." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <script>
      // Apply stored theme before first paint to avoid a flash.
      (function () {
        var r = document.documentElement;
        r.classList.add('js');
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === 'light') r.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
